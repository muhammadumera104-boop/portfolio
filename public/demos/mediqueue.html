<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>MediQueue – Smart Hospital Queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f9fb;--card:#fff;--tx:#12303d;--mut:#5b7480;--b:#d9e6ec;--pri:#0b7fc4;--teal:#0d9488;--grn:#16a34a;--amb:#d97706;--red:#dc2626;--soft:#e6f4f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1a21;--card:#13262f;--tx:#e6f1f5;--mut:#92aab5;--b:#254250;--soft:#123a38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1a21;--card:#13262f;--tx:#e6f1f5;--mut:#92aab5;--b:#254250;--soft:#123a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.logo{font-weight:800;font-size:1.25rem;color:var(--pri);margin-right:auto}.logo span{color:var(--teal)}
nav{display:flex;flex-wrap:wrap;gap:4px}nav a{padding:8px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:600;font-size:.95rem}nav a.on,nav a:hover{background:var(--soft);color:var(--teal)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.3rem;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hero{background:linear-gradient(135deg,var(--pri),var(--teal));color:#fff;border:0}.hero p{opacity:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:12px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.sec{background:var(--soft);color:var(--teal)}.btn.red{background:var(--red)}.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}.hero .btn{background:#fff;color:var(--pri)}
label{display:block;font-weight:600;margin:12px 0 4px}input,select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--tx);font:inherit}
.err{color:var(--red);font-size:.9rem;min-height:1.2em}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem;color:#fff}.Waiting{background:var(--pri)}.Almost{background:var(--amb)}.Consult{background:var(--grn)}.Done,.Off{background:#6b7f89}.Delayed,.Cancelled,.Closed{background:var(--red)}.Available{background:var(--grn)}.Consulting{background:var(--teal)}
.tok{font-size:3rem;font-weight:800;color:var(--pri);letter-spacing:2px;line-height:1.1}
.bar{height:16px;border-radius:99px;background:var(--b);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--grn));transition:width .8s}
.stat{font-size:2rem;font-weight:800;color:var(--teal)}.mut{color:var(--mut);font-size:.9rem}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--teal));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}
#toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;gap:8px;max-width:340px}
.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;animation:in .3s;font-size:.95rem}
.warn{background:#fff7e6;color:#7a4b00;border:1px solid #f1c27a;border-radius:12px;padding:10px 14px;font-size:.9rem}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a2c10;color:#f5d08f;border-color:#6b5120}}
svg text{font:600 12px system-ui;fill:var(--tx)}.room{fill:var(--card);stroke:var(--b);stroke-width:2}.room.hi{fill:var(--soft);stroke:var(--teal);stroke-width:3}
@media print{header,#toasts,.noprint{display:none!important}body::before{display:none}}
</style></head><body>
<header><div class="logo">Medi<span>Queue</span></div><nav id="nav"></nav></header>
<main id="app"></main><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEPTS=[{n:'Cardiology',p:'C',room:'Room 12',avg:10},{n:'General Medicine',p:'G',room:'Room 3',avg:7},{n:'Neurology',p:'N',room:'Room 21',avg:12},{n:'Pediatrics',p:'P',room:'Room 7',avg:8},{n:'Emergency',p:'E',room:'ER Wing',avg:5}];
const DOCS=[['Dr. Ayesha Khan','Cardiology','MBBS, FCPS (Cardiology)','9:00 AM – 2:00 PM'],['Dr. Bilal Ahmed','Cardiology','MBBS, MRCP','2:00 PM – 8:00 PM'],['Dr. Sana Malik','General Medicine','MBBS, FCPS (Medicine)','9:00 AM – 5:00 PM'],['Dr. Omar Farooq','Neurology','MBBS, FCPS (Neurology)','10:00 AM – 4:00 PM'],['Dr. Hina Raza','Pediatrics','MBBS, DCH','9:00 AM – 3:00 PM'],['Dr. Imran Siddiqui','Emergency','MBBS, FCPS (Emergency)','24 hours']].map(d=>({name:d[0],dept:d[1],q:d[2],time:d[3],s:'Available'}));
const NAMES=['Ali Raza','Fatima Noor','Hassan Iqbal','Zainab Shah','Usman Tariq','Maryam Aziz','Kamran Ali','Sadia Hussain','Bilal Qureshi','Noor Fatima'];
const dp=n=>DEPTS.find(d=>d.n===n);
let S,me=null,tab='queues',notes=[],sent={},form={};
function load(){try{S=JSON.parse(localStorage.getItem('mq1'));me=localStorage.getItem('mq1me')}catch(e){}if(!S)seed();if(!S.stock){S.stock=stock0();S.rx=[]}}
function save(){try{localStorage.setItem('mq1',JSON.stringify(S));if(me)localStorage.setItem('mq1me',me)}catch(e){}}
function seed(){S={d:{},t:[],doc:DOCS,stock:stock0(),rx:[]};DEPTS.forEach(d=>{S.d[d.n]={last:0,paused:false};for(let i=0;i<6;i++)mk(d.n,NAMES[(i*3+d.n.length)%10],20+i*7,'03'+(100000000+Math.floor(Math.random()*8e8)),1)});DEPTS.forEach(d=>callNext(d.n,1))}
function mk(dn,name,age,phone,quiet){const d=S.d[dn];d.last++;const t={id:Math.random().toString(36).slice(2,10),name,age,phone,dept:dn,num:d.last,st:'waiting',at:Date.now()};S.t.push(t);t.start=ahead(t);return t}
const label=t=>dp(t.dept).p+'-'+String(t.num).padStart(3,'0');
const act=dn=>S.t.filter(t=>t.dept===dn&&(t.st==='waiting'||t.st==='consult'));
const cur=dn=>S.t.find(t=>t.dept===dn&&t.st==='consult');
const docOf=dn=>S.doc.find(x=>x.dept===dn&&x.s!=='Off duty')||S.doc.find(x=>x.dept===dn);
const avail=dn=>S.doc.filter(x=>x.dept===dn&&x.s==='Available').length;
function ahead(t){return S.t.filter(x=>x.dept===t.dept&&x.st==='waiting'&&x.num<t.num).length+(cur(t.dept)&&t.st==='waiting'?1:0)}
function est(t){const a=ahead(t);return Math.round(a*dp(t.dept).avg/Math.max(1,avail(t.dept)))}
function stat(t){if(t.st==='consult')return['Consult','In Consultation'];if(t.st==='done')return['Done','Completed'];if(t.st==='cancelled')return['Cancelled','Cancelled'];if(S.d[t.dept].paused)return['Closed','Queue Paused'];return ahead(t)<=2?['Almost','Almost Your Turn']:['Waiting','Waiting']}
function callNext(dn,q){const c=cur(dn);if(c)c.st='done';const n=S.t.filter(t=>t.dept===dn&&t.st==='waiting').sort((a,b)=>a.num-b.num)[0];if(n){n.st='consult';S.d[dn].serving=n.num}if(!q)save()}
function toast(m){notes.unshift(m);const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),5000)}
function tick(){DEPTS.forEach(d=>{if(S.d[d.n].paused||!avail(d.n))return;if(Math.random()<.6)callNext(d.n,1);if(Math.random()<.2)mk(d.n,NAMES[Math.floor(Math.random()*10)],25+Math.floor(Math.random()*50),'0300'+Math.floor(1e6+Math.random()*8e6),1)});
 const t=S.t.find(x=>x.id===me);if(t&&t.st==='waiting'){const a=ahead(t);[3,1].forEach(l=>{if(a<=l&&!sent[t.id+l]){sent[t.id+l]=1;toast(l===3?'Your turn is approaching: only '+a+' patient(s) ahead.':'Almost your turn! Please head to '+dp(t.dept).room+'.')}})}save();const h=route();if(['home','track','doctors','admin'].includes(h))draw()}
function route(){const h=location.hash.slice(1)||'home';return h.startsWith('track-')?'track':h}
let otp='',lang='en';
const stock0=()=>[['Paracetamol 500mg',120],['Amoxicillin 500mg',45],['Aspirin 75mg',8],['Atorvastatin 20mg',60],['ORS Sachets',200],['Metformin 500mg',14]].map(x=>({n:x[0],q:x[1]}));
const KL={en:{d:'ltr',w:'Welcome. Take a token, then follow the map to your department.',b:['Get a token','Find a department','Track my token'],v:'en-US',n:'English'},ur:{d:'rtl',w:'خوش آمدید۔ ٹوکن لیں اور نقشے کے مطابق اپنے شعبے تک پہنچیں۔',b:['ٹوکن حاصل کریں','شعبہ تلاش کریں','میرا ٹوکن دیکھیں'],v:'ur-PK',n:'اردو'},sd:{d:'rtl',w:'ڀليڪار. ٽوڪن وٺو ۽ نقشي مطابق پنهنجي کاتي ڏانهن وڃو.',b:['ٽوڪن وٺو','کاتو ڳوليو','منهنجو ٽوڪن ڏسو'],v:'sd-PK',n:'سنڌي'}};
function solutions(){const U=['Entrance large screens with Sindhi, Urdu and English selection and voice guidance','QR code on slip or card with indoor Bluetooth beacon routing','Live token badge','Real-time pharmacy inventory tracking','Visit journey card with step-by-step checkboxes and floor maps (with M.Hassan)','AI symptom search and hospital selection (with M.Hassan)'],H=['Secure login with WhatsApp OTP verification','Automated WhatsApp notifications for queue tokens','Live reverse countdown timer','Doctor AI mic and digital prescription link to the pharmacy','Visit journey card with step-by-step checkboxes and floor maps (with M.Umer)','AI symptom search and hospital selection (with M.Umer)'],col=(n,a)=>`<div class="card"><h2>${n}</h2><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return `<h1>Solutions</h1><div class="grid">${col('M.Umer',U)}${col('M.Hassan',H)}</div>`}
function kiosk(){const k=KL[lang];return `<div class="card hero" dir="${k.d}" style="text-align:center"><h1 style="font-size:2.2rem">${k.w}</h1></div><div class="row" style="justify-content:center;margin-bottom:14px">${Object.keys(KL).map(x=>`<button class="btn ${x===lang?'':'sec'}" onclick="lang='${x}';draw()">${KL[x].n}</button>`).join('')}<button class="btn sec" onclick="say()">🔊 Listen</button></div><div class="grid">${['#register','#map','#track'].map((h,i)=>`<a class="btn" style="min-height:90px;font-size:1.4rem" dir="${k.d}" href="${h}">${k.b[i]}</a>`).join('')}</div><p class="mut">Entrance screen demo. Voice uses your browser’s text-to-speech; Sindhi voice support varies by device.</p>`}
function say(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(KL[lang].w);u.lang=KL[lang].v;speechSynthesis.speak(u)}catch(e){toast('Voice is not supported in this browser.')}}
function journey(){const t=S.t.find(x=>x.id===me);if(!t)return `<h1>Visit Journey</h1><div class="card"><p>Get a token first to see your journey card.</p><a class="btn" href="#register">Register</a></div>`;const j=(S.j||{})[t.id]||[],d=dp(t.dept),st=['Register and receive your token ('+label(t)+')','Walk to '+d.n+' ('+d.room+') using the map','Wait for your turn: track it live on your phone','Consultation with '+(docOf(t.dept)||{name:'the doctor'}).name,'Laboratory tests (only if the doctor advises)','Collect medicines at Pharmacy Desk #2'];
return `<h1>Visit Journey Card</h1><div class="card">${st.map((s,i)=>`<label style="display:flex;gap:12px;align-items:center;margin:8px 0;font-weight:500"><input type="checkbox" style="width:28px;min-height:28px" ${j[i]?'checked':''} onchange="jt('${t.id}',${i},this.checked)">${s}</label>`).join('')}<div class="row noprint"><a class="btn sec" href="#map">Open floor map</a><button class="btn sec" onclick="window.print()">Print card</button></div></div>`}
function jt(id,i,v){S.j=S.j||{};(S.j[id]=S.j[id]||[])[i]=v;save()}
function pharmacy(){return `<h1>Voice Prescription and Pharmacy Stock</h1><div class="card"><h2>Doctor: dictate prescription</h2><label for="rxt">Prescription (speak or type)</label><input id="rxt" placeholder="e.g. Paracetamol and Amoxicillin for 5 days"><div class="row" style="margin-top:10px"><button class="btn sec" onclick="mic()">🎤 Speak</button><button class="btn" onclick="rxSend()">Send to Pharmacy Desk #2</button></div><p class="mut">Clean digital text replaces handwriting. Demo matches medicine names to stock.</p></div><div class="card scroll"><h2>Pharmacy: live stock</h2><table><tr><th>Medicine</th><th>In stock</th><th>Status</th><th></th></tr>${S.stock.map((m,i)=>`<tr><td>${m.n}</td><td><b>${m.q}</b></td><td><span class="badge ${m.q===0?'Closed':m.q<20?'Almost':'Available'}">${m.q===0?'Out of stock':m.q<20?'Low':'OK'}</span></td><td><button class="btn sm sec" onclick="restock(${i})">Restock +50</button></td></tr>`).join('')}</table></div><div class="card"><h2>Incoming prescriptions</h2>${S.rx.length?S.rx.map(r=>`<p><b>${r.at}</b> · ${esc(r.tx)}<br><span class="mut">Desk #2 · ${r.meds.length?'Matched: '+r.meds.join(', '):'No stock match'}${r.out.length?' · Out of stock: '+r.out.join(', '):''}</span></p>`).join(''):'<p class="mut">No prescriptions yet.</p>'}</div>`}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input is not supported in this browser. Please type instead.');const r=new R();r.lang='en-US';r.onresult=e=>{$('#rxt').value+=' '+e.results[0][0].transcript};r.onerror=()=>toast('Microphone unavailable. Please type instead.');r.start();toast('Listening…')}
function rxSend(){const tx=$('#rxt').value.trim();if(tx.length<3)return toast('Dictate or type the prescription first.');const hit=S.stock.filter(m=>tx.toLowerCase().includes(m.n.split(' ')[0].toLowerCase())),out=[];hit.forEach(m=>{if(m.q>0)m.q--;else out.push(m.n)});S.rx.unshift({tx,meds:hit.map(m=>m.n),out,at:new Date().toLocaleTimeString()});toast('Prescription sent to Pharmacy Desk #2'+(out.length?'. Out of stock: '+out.join(', '):''));save();draw()}
function restock(i){S.stock[i].q+=50;save();draw()}
function sym(){const s=$('#f_s').value.toLowerCase(),M=[['Cardiology',/chest|heart|palpit|breath|سین|دل/],['Neurology',/head|migraine|seiz|numb|stroke|سر|دور/],['Pediatrics',/child|baby|infant|kid|بچ/],['Emergency',/accident|bleed|unconscious|burn|emergency|حادثہ|خون/]],m=M.find(x=>x[1].test(s)),dn=m?m[0]:'General Medicine';$('#f_d').value=dn;hint();$('#sh').textContent='Suggested: '+dn+' (demo keyword match, not a medical diagnosis). Matched hospital: Jinnah Hospital (demo).'}
function otpGo(){if($('#f_o').value.trim()!==otp){$('#e_o').textContent='Incorrect code. Check your WhatsApp.';return}const t=mk($('#f_d').value,$('#f_n').value.trim(),+$('#f_a').value,$('#f_p').value.replace(/[\s-]/g,''));me=t.id;form={};save();location.hash='#token'}
const NAV=[['home','Home'],['register','Register'],['track','Live Queue'],['doctors','Doctors'],['map','Map'],['solutions','Solutions'],['kiosk','Kiosk'],['journey','Journey'],['pharmacy','Pharmacy'],['admin','Admin']];
function draw(){const h=route();$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===h?'on':''}">${n[1]}</a>`).join('')+`<a href="#alerts" class="${h==='alerts'?'on':''}">🔔${notes.length?' '+notes.length:''}</a>`;
 const v={home,register,token,track,doctors,map,admin,alerts,solutions,kiosk,journey,pharmacy}[h]||home;$('#app').innerHTML=v();if(window['after_'+h])window['after_'+h]()}
function myTok(){const h=location.hash.slice(1);const id=h.startsWith('track-')?h.slice(6):me;return S.t.find(t=>t.id===id)}
const sv=t=>{const[c,l]=stat(t);return `<span class="badge ${c}">${l}</span>`};
function home(){const tot=S.t.filter(t=>t.st==='waiting').length;return `<div class="card hero"><h1>Skip the line. Know your turn.</h1><p>Get a digital token, scan your QR code and follow your place in the queue in real time.</p><div class="row"><a class="btn" href="#register">Get a token</a><a class="btn" href="#track">Track my token</a></div></div>
<div class="grid"><div class="card"><div class="mut">Patients waiting now</div><div class="stat">${tot}</div></div><div class="card"><div class="mut">Doctors available</div><div class="stat">${S.doc.filter(d=>d.s==='Available').length}/${S.doc.length}</div></div><div class="card"><div class="mut">Busiest department</div><div class="stat" style="font-size:1.4rem">${busy()}</div></div></div>
<h2>Now serving · current token by department</h2><div class="grid">${DEPTS.map(d=>{const w=act(d.n).length,pc=S.d[d.n].paused;return `<div class="card"><b>${d.n}</b><div class="mut">${d.room} · Now serving</div><div class="tok" style="font-size:2.4rem">${cur(d.n)?label(cur(d.n)):'–'}</div><div class="row sp"><span class="mut">Current token</span><span class="badge ${pc?'Closed':w>=8?'Almost':'Available'}">${pc?'Paused':w>=8?'Busy':'Light'}</span></div><div class="mut">${w} in queue</div></div>`}).join('')}</div>
<p class="warn">Demo mode: sample doctors, patients and queue movement are simulated in your browser. Wait times are approximate, not guaranteed.</p>`}
function busy(){return DEPTS.slice().sort((a,b)=>act(b.n).length-act(a.n).length)[0].n}
function register(){const q=DEPTS.slice().sort((a,b)=>act(a.n).length-act(b.n).length)[0];return `<h1>Patient Registration</h1><div class="card"><label for="f_n">Full name</label><input id="f_n" autocomplete="name" value="${esc(form.n||'')}"><div class="err" id="e_n"></div>
<label for="f_a">Age</label><input id="f_a" type="number" inputmode="numeric" value="${esc(form.a||'')}"><div class="err" id="e_a"></div>
<label for="f_p">Phone number</label><input id="f_p" type="tel" placeholder="03XXXXXXXXX" value="${esc(form.p||'')}"><div class="err" id="e_p"></div>
<label for="f_s">Describe your symptoms (English or Urdu)</label><div class="row"><input id="f_s" style="flex:1;min-width:180px" placeholder="e.g. chest pain"><button class="btn sec" onclick="sym()">Suggest department</button></div><p class="mut" id="sh"></p><label for="f_d">Department</label><select id="f_d" onchange="hint()">${DEPTS.map(d=>`<option>${d.n}</option>`).join('')}</select>
<p class="mut" id="hint"></p><button class="btn" id="go" onclick="reg()">Generate my token</button></div><p class="mut">Least crowded right now: <b>${q.n}</b> (approximate).</p>`}
function after_register(){hint()}
function hint(){const dn=$('#f_d').value,w=act(dn).length;$('#hint').textContent=w>=8?`Heavy traffic in ${dn} (${w} waiting). Approximate: quieter later in the afternoon.`:`${w} waiting. Estimated wait about ${Math.round(w*dp(dn).avg/Math.max(1,avail(dn)))} min (approximate).`}
function reg(){const n=$('#f_n').value.trim(),a=+$('#f_a').value,p=$('#f_p').value.replace(/[\s-]/g,''),dn=$('#f_d').value;form={n,a:$('#f_a').value,p:$('#f_p').value};let ok=1;
 const e=(k,m)=>{$('#e_'+k).textContent=m;if(m)ok=0};e('n',n.length<3?'Please enter your full name.':'');e('a',!(a>0&&a<121)?'Enter an age between 1 and 120.':'');e('p',!/^(\+?92|0)3\d{9}$/.test(p)?'Enter a valid mobile number, e.g. 03001234567.':'');if(!ok)return;
 $('#go').textContent='Generating…';$('#go').disabled=true;otp=String(1000+Math.floor(Math.random()*9000));toast('WhatsApp code (demo): '+otp);$('#go').outerHTML='<label for="f_o">Enter the 4-digit code sent to your WhatsApp</label><input id="f_o" inputmode="numeric" maxlength="4"><div class="err" id="e_o"></div><button class="btn" onclick="otpGo()">Verify and generate token</button>'}
function token(){const t=S.t.find(x=>x.id===me);if(!t)return `<h1>No token yet</h1><a class="btn" href="#register">Register now</a>`;const d=dp(t.dept),dc=docOf(t.dept);
 return `<h1>Your Digital Token</h1><div class="card" style="text-align:center"><div class="mut">Token number</div><div class="tok">${label(t)}</div><div id="qr" style="display:inline-block;padding:12px;background:#fff;border-radius:12px;margin:12px 0"></div>
<div><b>${esc(t.name)}</b> · ${d.n}</div><div class="mut">${dc?dc.name+' · ':''}${d.room}</div><p>Now serving: <b>${cur(t.dept)?label(cur(t.dept)):'–'}</b><br>Estimated wait: <b>${est(t)} min</b> <span class="mut">(approximate)</span></p>
<p class="mut">This QR holds only a secure random ID. No personal details are stored in it.</p><div class="row noprint" style="justify-content:center"><a class="btn" href="#track">Track live queue</a><a class="btn sec" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('My hospital token '+label(t)+' ('+d.n+'). Track: '+location.href.split('#')[0]+'#track-'+t.id)}">Send to WhatsApp</a><a class="btn sec" href="#journey">Visit journey card</a><button class="btn sec" onclick="window.print()">Print / Save as PDF</button></div></div>`}
function after_token(){const t=S.t.find(x=>x.id===me);if(t&&window.QRCode)new QRCode($('#qr'),{text:location.href.split('#')[0]+'#track-'+t.id,width:190,height:190})}
function track(){const t=myTok();if(!t)return `<h1>Live Queue</h1><div class="card"><p>No token found on this device.</p><a class="btn" href="#register">Get a token</a></div><h2>Now serving</h2>${nowBoard()}`;const d=dp(t.dept),dc=docOf(t.dept),a=ahead(t),c=cur(t.dept);
 const pct=t.st==='waiting'?Math.max(5,Math.round((1-a/Math.max(1,t.start))*100)):100;
 return `<h1>Live Queue Tracking</h1><div class="card"><div class="row sp"><div><div class="mut">Your token</div><div class="tok">${label(t)}</div></div>${sv(t)}</div><div class="bar" style="margin:14px 0"><i style="width:${pct}%"></i></div>
<div class="grid"><div><div class="mut">Now serving</div><b style="font-size:1.6rem">${c?label(c):'–'}</b></div><div><div class="mut">Patients ahead</div><b style="font-size:1.6rem">${t.st==='waiting'?a:0}</b></div><div><div class="mut">Est. wait (approx.)</div><b id="cd" ${t.st==='waiting'?'data-e="'+(Date.now()+est(t)*60000)+'"':''} style="font-size:1.6rem">${t.st==='waiting'?est(t)+' min':'–'}</b></div></div></div>
<div class="card"><b>${dc?dc.name:'Doctor TBA'}</b> · ${d.n} · ${d.room}${dc&&dc.s!=='Available'?` <span class="badge ${dc.s==='Off duty'?'Off':'Delayed'}">${dc.s}</span>`:''}</div>
${t.st==='waiting'&&a<=3?'<div class="warn">Your turn is coming up. Please stay near '+d.room+'.</div>':''}<p class="mut">Updates automatically. Estimates are approximate, not guaranteed.</p>`}
function doctors(){return `<h1>Doctors</h1><div class="grid">${S.doc.map(x=>{const dn=x.dept,isC=docOf(dn)===x&&cur(dn)&&x.s==='Available',s=isC?'Consulting':x.s==='Off duty'?'Off':x.s,w=act(dn).length;
 return `<div class="card"><div class="row"><div class="av">${x.name.split(' ').slice(1).map(w=>w[0]).join('')}</div><div><b>${x.name}</b><div class="mut">${x.dept}</div></div></div><p class="mut" style="margin:10px 0 4px">${x.q}<br>${x.time}</p><span class="badge ${s}">${isC?'Consulting':x.s}</span>${x.s==='Delayed'?`<div class="mut">Estimated wait for doctor: ~15 min</div>`:isC?`<div class="mut">Free in about ${dp(dn).avg} min</div>`:''}</div>`}).join('')}</div>`}
const ROOMS=[['Reception',1,1],['Pharmacy',2,1],['Laboratory',3,1],['General Medicine',1,2],['Neurology',2,2],['Cardiology',3,2],['Pediatrics',1,3],['Emergency',2,3],['Entrance',3,3]];
const rx=r=>20+(r[1]-1)*140,ry=r=>20+(r[2]-1)*110;
function nowBoard(){return `<div class="grid">${DEPTS.map(d=>`<div class="card"><b>${d.n}</b><div class="tok" style="font-size:2.2rem">${cur(d.n)?label(cur(d.n)):'–'}</div><div class="mut">${act(d.n).length} in queue</div></div>`).join('')}</div>`}
function mapPath(n){const r=ROOMS.find(x=>x[0]===n);if(!r||n==='Entrance')return[];const cx=rx(r)+65,g=r[1]===1?155:295,p=[[365,258],[365,220]];if(r[2]===3)p.push([cx,220],[cx,255]);else if(r[2]===2)p.push([cx,220],[cx,185]);else p.push([g,220],[g,110],[cx,110],[cx,75]);return p}
function mapSvg(sel){const p=mapPath(sel);return `<div class="scroll"><svg viewBox="0 0 450 330" style="width:100%;min-width:420px;margin-top:12px"><rect x="10" y="90" width="430" height="40" fill="var(--soft)" opacity=".6"/><rect x="10" y="200" width="430" height="40" fill="var(--soft)" opacity=".6"/>${ROOMS.map(r=>`<g onclick="mapSel='${r[0]}';draw()" style="cursor:pointer"><rect class="room ${r[0]===sel?'hi':''}" x="${rx(r)}" y="${ry(r)}" width="130" height="70" rx="10"/><text x="${rx(r)+65}" y="${ry(r)+(r[0]==='Entrance'?60:39)}" text-anchor="middle">${r[0]==='Entrance'?'Main Entrance':r[0]}</text></g>`).join('')}${p.length?`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="1s" repeatCount="indefinite"/></polyline><circle cx="${p[p.length-1][0]}" cy="${p[p.length-1][1]}" r="9" fill="var(--red)"/>`:''}<circle cx="365" cy="258" r="9" fill="var(--grn)" stroke="#fff" stroke-width="3"/><text x="365" y="284" text-anchor="middle" style="fill:var(--grn)">You are here</text></svg></div>`}
function mapInfo(n){if(n==='Entrance')return '<div class="card" style="background:var(--soft)"><b>You are here: Main Entrance</b></div>';const r=ROOMS.find(x=>x[0]===n),d=dp(n),c=d&&cur(n),dc=d&&docOf(n),col=r[1],row=r[2];let s;
 if(row===3)s=col===2?['Turn left (west) along the front corridor.','Emergency is the first room beside the entrance. Go in through the door on your left.']:['Turn left (west) along the front corridor.','Walk to the far end. Pediatrics is the last room, on your left.'];
 else if(row===2)s=col===3?['Walk straight ahead (north). Cardiology is directly in front of the entrance.']:['Turn left (west) along the front corridor.',col===1?'Walk to the far end, below General Medicine, then turn right (north) into its door.':'Walk until you are below Neurology, then turn right (north) into its door.'];
 else s=['Turn left (west) along the front corridor.',col===1?'Walk past the middle rooms to the passage between the left and middle rooms, then turn right (north).':'Take the first passage on your right (north), between the middle and right-hand rooms.','At the upper corridor turn '+(col===3?'right (east)':'left (west)')+' and walk to '+n+'.'];
 return '<div class="card" style="background:var(--soft)"><b>'+n+'</b>'+(d?' · '+d.room+'<div>Now serving: <b>'+(c?label(c):'–')+'</b>'+(dc?' · '+dc.name:'')+'</div>':'')+'</div><h2>How to get there</h2><ol><li>Start at the Main Entrance (the green dot, you are here).</li>'+s.map(x=>'<li>'+x+'</li>').join('')+'</ol>'}

let mapSel=null;
function map(){const t=S.t.find(x=>x.id===me),sel=mapSel||(t?t.dept:'Cardiology');
 return `<h1>Hospital Navigator</h1><div class="card"><label for="ms">Where do you need to go? (or tap a room on the map)</label><select id="ms" onchange="mapSel=this.value;draw()">${['Reception','Pharmacy','Laboratory',...DEPTS.map(d=>d.n)].map(n=>`<option ${n===sel?'selected':''}>${n}</option>`).join('')}</select>
${mapSvg(sel)}
${mapInfo(sel)}
<p class="mut">Facilities: wheelchair ramps at all entrances, lifts to every floor, accessible washrooms, wheelchair assistance at Reception.</p><p class="mut">Demo floor plan, not to scale.</p></div>`}
function alerts(){return `<h1>Notifications</h1><div class="card">${notes.length?notes.map(n=>`<p>🔔 ${esc(n)}</p>`).join(''):'<p class="mut">No alerts yet. You will be notified when your turn approaches or a doctor is delayed.</p>'}<p class="mut">SMS alerts are optional and require a backend SMS provider (not connected in this demo).</p></div>`}
function admin_(){}
function admin(){if(!admin_.ok)return `<h1>Admin Sign-in</h1><div class="card"><label for="pin">Staff PIN</label><input id="pin" type="password" inputmode="numeric"><div class="err" id="pe"></div><button class="btn" onclick="login()">Sign in</button><p class="mut">Demo PIN: 1234. In production use real authentication and role-based access.</p></div>`;
 const all=S.t,done=all.filter(t=>t.st==='done').length,w=all.filter(t=>t.st==='waiting').length,tabs=['queues','tokens','doctors','issue'];
 const body={queues:()=>`<div class="grid">${DEPTS.map(d=>{const p=S.d[d.n].paused;return `<div class="card"><b>${d.n}</b><div>Serving: <b>${cur(d.n)?label(cur(d.n)):'–'}</b> · Waiting: <b>${S.t.filter(t=>t.dept===d.n&&t.st==='waiting').length}</b></div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="callNext('${d.n}');draw()">Call next</button><button class="btn sm ${p?'':'sec'}" onclick="S.d['${d.n}'].paused=!S.d['${d.n}'].paused;save();draw()">${p?'Resume':'Pause'}</button></div></div>`}).join('')}</div>`,
 tokens:()=>`<div class="card scroll"><table><tr><th>Token</th><th>Patient</th><th>Dept</th><th>Status</th><th>Actions</th></tr>${S.t.filter(t=>t.st==='waiting'||t.st==='consult').sort((a,b)=>a.dept.localeCompare(b.dept)||a.num-b.num).map(t=>`<tr><td><b>${label(t)}</b></td><td>${esc(t.name)}</td><td>${t.dept}</td><td>${sv(t)}</td><td><button class="btn sm red" onclick="cancelT('${t.id}')">Cancel</button> <select style="width:auto;min-height:38px" onchange="xfer('${t.id}',this.value)"><option value="">Transfer…</option>${DEPTS.filter(d=>d.n!==t.dept).map(d=>`<option>${d.n}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`,
 doctors:()=>`<div class="card scroll"><table>${S.doc.map((x,i)=>`<tr><td><b>${x.name}</b><div class="mut">${x.dept} · ${x.time}</div></td><td><select style="min-height:38px" onchange="setDoc(${i},this.value)">${['Available','Delayed','Off duty'].map(s=>`<option ${s===x.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`,
 issue:()=>`<div class="card"><label for="in">Patient name</label><input id="in"><label for="id">Department</label><select id="id">${DEPTS.map(d=>`<option>${d.n}</option>`).join('')}</select><br><br><button class="btn" onclick="issue()">Issue walk-in token</button></div>`}[tab];
 return `<h1>Admin Dashboard</h1><div class="grid"><div class="card"><div class="mut">Active tokens</div><div class="stat">${w}</div></div><div class="card"><div class="mut">Served today</div><div class="stat">${done}</div></div><div class="card"><div class="mut">Avg wait (approx.)</div><div class="stat">${Math.round(DEPTS.reduce((s,d)=>s+act(d.n).length*d.avg,0)/DEPTS.length/5)} min</div></div><div class="card"><div class="mut">Most crowded</div><div class="stat" style="font-size:1.3rem">${busy()}</div></div></div>
 <div class="row" style="margin-bottom:12px">${tabs.map(x=>`<button class="btn sm ${x===tab?'':'sec'}" onclick="tab='${x}';draw()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<button class="btn sm sec" onclick="admin_.ok=0;draw()">Sign out</button></div>${body()}`}
function login(){if($('#pin').value==='1234'){admin_.ok=1;draw()}else $('#pe').textContent='Incorrect PIN.'}
function cancelT(id){const t=S.t.find(x=>x.id===id);t.st='cancelled';save();draw()}
function xfer(id,dn){if(!dn)return;const t=S.t.find(x=>x.id===id);t.dept=dn;t.num=++S.d[dn].last;t.st='waiting';t.start=ahead(t);toast('Token transferred to '+dn);save();draw()}
function setDoc(i,s){S.doc[i].s=s;if(s==='Delayed')toast(S.doc[i].name+' is delayed. Wait times may increase.');if(s==='Off duty')toast(S.doc[i].name+' is unavailable.');save();draw()}
function issue(){const n=$('#in').value.trim();if(n.length<3)return toast('Enter a patient name.');const t=mk($('#id').value,n,0,'walk-in');toast('Issued '+label(t));save();draw()}
window.addEventListener('hashchange',()=>{draw();window.scrollTo(0,0)});
load();draw();setInterval(tick,7000);setInterval(()=>{const e=$('#cd');if(!e||!e.dataset.e)return;const s=Math.max(0,Math.round((e.dataset.e-Date.now())/1000));e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
</script></body></html>
