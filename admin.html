<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — M. Umer</title>
  <meta name="description" content="Private dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function () {
      var root = document.documentElement, saved = null;
      root.classList.add('js');
      try { saved = localStorage.getItem('umer-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script type="module" src="/src/admin/admin.js"></script>
</head>
<body class="admin-body">
<div id="admin-root"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">The dashboard needs JavaScript.</p></noscript>
</body>
</html>
