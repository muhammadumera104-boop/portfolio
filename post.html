<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog post — Muhammad Umer Rizwan</title>
  <meta name="description" content="A post from the blog of Muhammad Umer Rizwan.">
  <meta name="author" content="Muhammad Umer Rizwan">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      var root = document.documentElement, saved = null;
      root.classList.add('js');
      try { saved = localStorage.getItem('umer-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script type="module" src="/src/blog/post.js"></script>
</head>
<body>
<noscript><p style="padding:2rem;font-family:sans-serif">This page needs JavaScript to load the post.</p></noscript>
</body>
</html>
